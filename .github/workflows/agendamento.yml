name: Robô IPMA - 10 Minutos

on:
  push:
    branches: [ main ]
  schedule:
    # Agendamento: Corre aos 10 minutos de todas as horas (00:10, 01:10...)
    - cron: '10 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Fundamental para o robô ter autorização para gravar ficheiros no teu repo
    permissions:
      contents: write

    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar Bibliotecas
        run: pip install -r requirements.txt

      - name: Executar o Extrator IPMA
        run: python main.py

      - name: Gravar Ficheiros no GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Atualização Automática: Dados IPMA"
          # Força o GitHub a guardar os dois ficheiros que o script gerou
          file_pattern: 'Painel_Mestre_IPMA.csv Painel_Mestre_IPMA.xlsx'
