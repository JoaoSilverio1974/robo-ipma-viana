name: Atualizacao Diaria IPMA

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: pip install pandas selenium webdriver-manager openpyxl

      - name: Correr o robo
        run: python main.py

      - name: Commit e Push dos Dados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Atualização Automática: XLSX e CSV"
          # Garante que o GitHub deteta e guarda ambos os ficheiros
          file_pattern: 'Painel_Mestre_IPMA.xlsx Painel_Mestre_IPMA.csv'
