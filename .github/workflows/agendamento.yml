name: Robô IPMA - 10 Minutos

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar Bibliotecas
        run: pip install -r requirements.txt

      - name: Executar o Extrator IPMA
        run: python main.py

      - name: Forçar Atualização e Gravar Ficheiros
        run: |
          # 1. Configura quem é o "robô"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 2. Adiciona os ficheiros acabados de gerar
          git add Painel_Mestre_IPMA.csv Painel_Mestre_IPMA.xlsx log_execucao.csv
          git commit -m "🤖 Atualização Automática: Dados IPMA" || echo "Sem alterações para gravar"
          
          # 3. Tenta enviar para o GitHub. Se o Excel colidir, usamos a tática de esmagamento automático!
          git push origin main || {
            echo "A tentar resolver o conflito de Excel..."
            git pull origin main --no-rebase -X ours
            git push origin main
          }
